<div class="game-container">
  <canvas
    #gameCanvas
    class="game-canvas"
    (click)="togglePause()"
    (mousemove)="onPointerMove($event)"
    (touchmove)="onTouchMove($event); $event.preventDefault()"
    (touchstart)="$event.preventDefault()"
  ></canvas>
  
  <!-- 選單 -->
  <div class="menu-overlay" *ngIf="gameData.state === gameState.MENU">
    <div class="menu-content">
      <h1>🍎 接物遊戲 🍎</h1>
      <p class="story-text">用籃子接住掉落的水果！<br/>漏接太多遊戲就結束了！連擊有加分。</p>
      <p class="high-score">最高記錄: {{ getHighScore() }} 分</p>
      <p class="instructions">鍵盤 ← → 或 A/D 移動，也可直接滑鼠或手指拖曳籃子</p>
      <ion-button expand="block" (click)="startGame()">開始遊戲</ion-button>
      <ion-button expand="block" fill="outline" (click)="goHome()" class="btn-secondary">返回主頁</ion-button>
    </div>
  </div>

  <!-- 遊戲結束 -->
  <div class="menu-overlay" *ngIf="gameData.state === gameState.GAME_OVER">
    <div class="menu-content">
      <h1>遊戲結束</h1>
      <p class="final-score">最終分數: {{ gameData.score }} 分</p>
      <p class="high-score" *ngIf="gameData.score > getHighScore()">🎉 新紀錄！</p>
      <p class="high-score" *ngIf="gameData.score <= getHighScore()">最高記錄: {{ getHighScore() }} 分</p>
      <ion-button expand="block" (click)="startGame()">再試一次</ion-button>
      <ion-button expand="block" fill="outline" (click)="goHome()" class="btn-secondary">返回主頁</ion-button>
    </div>
  </div>
</div>
